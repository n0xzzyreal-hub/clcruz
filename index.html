<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CL Cruz Tecnologia. Basta acreditar.</title>
<meta name="description" content="CL Cruz Tecnologia. Nossos produtos estão no Mercado Livre.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0F1C2E;--mut:#A9B6CB}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:#fff;font:400 16px/1.5 "Plus Jakarta Sans",system-ui,sans-serif}
.pagina{min-height:100vh;min-height:100svh;display:grid;grid-template-rows:auto 1fr auto;max-width:1240px;margin:0 auto;padding:0 24px}
.brand{display:flex;align-items:center;gap:10px;padding:20px 0;font-weight:800}
.mono{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:#fff;color:var(--ink);font-size:14px}
.centro{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 0 48px}
h1{margin:0;font-size:clamp(3rem,10vw,7rem);line-height:.95;letter-spacing:-.05em;font-weight:800}
.centro p{margin:20px 0 36px;color:var(--mut);font-size:18px}
.btn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:var(--ink);text-decoration:none;font-weight:600;font-size:17px;padding:16px 32px;border-radius:14px}
.btn:hover{background:#E6EBF3}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
footer{padding:20px 0;color:var(--mut);font-size:14px;text-align:center}
@media(max-width:560px){.pagina{padding:0 16px}.btn{width:100%;justify-content:center}}
</style>
</head>
<body>
<div class="pagina">
  <div class="brand"><span class="mono" aria-hidden="true">CL</span>CL Cruz Tecnologia</div>
  <main class="centro">
    <h1>Basta acreditar.</h1>
    <p>Nossos produtos estão no Mercado Livre.</p>
    <a class="btn" id="loja" href="#">Ver loja no Mercado Livre
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
  </main>
  <footer>Venda e entrega pelo Mercado Livre.</footer>
</div>
<script>
// Cole entre as aspas o link da loja no Mercado Livre.
const LOJA="https://lista.mercadolivre.com.br/_CustId_9683052?item_id=MLB5549362285&category_id=MLB438516&seller_id=9683052&client=recoview-selleritems&recos_listing=true&skipInApp=true&matt_ignore=true";
const a=document.getElementById("loja");
if(LOJA){a.href=LOJA;a.target="_blank";a.rel="noopener noreferrer"}else a.onclick=e=>e.preventDefault();
</script>
</body>
</html>
